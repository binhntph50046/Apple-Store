[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.bcmath",
  "php82Extensions.intl",
  "php82Extensions.tokenizer",
  "php82Extensions.fileinfo",
  "php82Extensions.openssl",
  "php82Extensions.exif",
  "php82Extensions.pcntl",
  "php82Extensions.posix",
  "php82Extensions.redis",
  "composer",
  "nodejs_20",
  "npm",
  "ffmpeg"
]

[phases.install]
cmds = [
  "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan event:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link --force 2>/dev/null; php artisan serve --host=0.0.0.0 --port=$PORT"
